<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 — Live now</title>
<link rel="stylesheet" href="_shared.css">
<style>html, body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
  <div class="shot-frame" id="shot">
    <div class="mockup-banner">Mock-up</div>
    <div class="scene-label">Live now — default mode, base zone picker, Copy for chat</div>
    <div class="win win-centered">
      <div class="titlebar"><span class="title">WorldClock14</span></div>
      <div class="body">
        <div class="row"><span class="radio on">Live now</span><span class="radio">Custom time</span><span class="btn push-right">Settings</span></div>
        <div>Times are read in</div>
        <div class="combo"><span>IST&nbsp;&nbsp;(Asia/Kolkata)</span></div>
        <table class="data spaced">
              <tr><td style="width:96px">IST</td><td>20:00</td><td style="width:62px"><span class="btn full">Copy</span></td></tr>
          <tr><td style="width:96px">JST</td><td>23:30</td><td style="width:62px"><span class="btn full">Copy</span></td></tr>
          <tr><td style="width:96px">UTC</td><td>14:30</td><td style="width:62px"><span class="btn full">Copy</span></td></tr>
          <tr><td style="width:96px">ET</td><td>10:30</td><td style="width:62px"><span class="btn full">Copy</span></td></tr>
        </table>
        <span class="btn full spaced">Copy for chat</span>
        <div>Copied: 20:00 IST | 23:30 JST | 14:30 UTC | 10:30 ET</div>
        <div class="disabled">Wed 07 Oct 2026 20:00</div>
      </div>
    </div>
  </div>
</body>
</html>
