<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 — Unknown zone row</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body class="standalone">
  <div class="win" id="shot">
    <div class="titlebar">
      <div class="title">TimeShift</div>
      <div class="ghost">Settings</div>
    </div>

    <div class="modes">
      <div class="mode on">Live now</div>
      <div class="mode">Custom time</div>
    </div>

    <div class="label">Times are read in</div>
    <div class="select"><span>IST&nbsp;&nbsp;(Asia/Kolkata)</span><span>▾</span></div>

    <table class="data">
      <tr>
        <td class="zone base">IST</td>
        <td><span class="time">20:00</span></td>
        <td style="width:62px"><span class="copy">Copy</span></td>
      </tr>
      <tr>
        <td class="zone">BadZone</td>
        <td><span class="errtext">unknown zone "Not/A/Real/Zone"</span></td>
        <td style="width:62px"></td>
      </tr>
      <tr>
        <td class="zone">UTC</td>
        <td><span class="time">14:30</span></td>
        <td style="width:62px"><span class="copy">Copy</span></td>
      </tr>
    </table>

    <button type="button" class="primary">Copy for chat</button>
    <div class="echo">Wed 07 Oct 2026 20:00</div>
  </div>
</body>
</html>
