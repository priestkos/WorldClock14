name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'screenshots/**'
      - '*.png'
      - '*.mp4'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the Dalamud development distribution
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force
          exit 0
      - name: Prepare release
        id: prep
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-FourPartVersion([string]$raw) {
            $text = $raw.Trim().TrimStart('v')
            $parts = @($text -split '\.')
            while ($parts.Count -lt 4) { $parts += '0' }
            if ($parts.Count -gt 4) { throw "Invalid version: $raw" }
            return [version]::new([int]$parts[0], [int]$parts[1], [int]$parts[2], [int]$parts[3])
          }

          function Format-FourPart([version]$v) {
            return "$($v.Major).$($v.Minor).$($v.Build).$($v.Revision)"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            [xml]$proj = Get-Content WorldClock14.csproj
            $csprojRaw = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
            $csprojVersion = Get-FourPartVersion $csprojRaw

            $releaseTags = @(
              gh release list --limit 500 --json tagName --jq '.[].tagName'
            )

            if ($releaseTags.Count -eq 0) {
              $nextVersion = $csprojVersion
            } else {
              $latestRelease = $releaseTags |
                ForEach-Object { Get-FourPartVersion $_ } |
                Sort-Object -Descending |
                Select-Object -First 1
              if ($csprojVersion -gt $latestRelease) {
                $nextVersion = $csprojVersion
              } else {
                $nextVersion = [version]::new(
                  $latestRelease.Major,
                  $latestRelease.Minor,
                  $latestRelease.Build,
                  $latestRelease.Revision + 1
                )
              }
            }

            $nextVersionText = Format-FourPart $nextVersion
            $tagName = "v$nextVersionText"

            $existingTag = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
              --jq ".[] | select(.target_commitish==\"$env:GITHUB_SHA\") | .tag_name" | Select-Object -First 1
            $global:LASTEXITCODE = 0
            if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
              Write-Host "Commit $env:GITHUB_SHA already has release $existingTag; skipping."
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }

            gh release view $tagName 2>$null | Out-Null
            $releaseExists = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($releaseExists) {
              Write-Host "Release $tagName already exists; skipping."
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }

            Write-Host "Automatic release version: $nextVersionText (tag $tagName)"
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mode=main" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "version=$nextVersionText" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/v*') {
            "mode=tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "mode=dispatch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          exit 0
      - name: Build WorldClock14
        if: steps.prep.outputs.skip != 'true'
        shell: pwsh
        run: |
          $args = @('build', 'WorldClock14.csproj', '-c', 'Release')
          $version = '${{ steps.prep.outputs.version }}'
          if (-not [string]::IsNullOrWhiteSpace($version)) {
            $args += @(
              "-p:Version=$version",
              "-p:AssemblyVersion=$version",
              "-p:FileVersion=$version"
            )
          }
          dotnet @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0
      - name: Create GitHub release
        if: steps.prep.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Read-ManifestFromZip([string]$zipPath) {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $dllEntries = @($archive.Entries | Where-Object { $_.Name -like '*.dll' })
              if ($dllEntries.Count -eq 0) {
                throw 'No plugin .dll found inside latest.zip'
              }
              $dllEntry = $dllEntries | Where-Object {
                [System.IO.Path]::GetFileNameWithoutExtension($_.Name) -eq 'WorldClock14'
              } | Select-Object -First 1
              if (-not $dllEntry) {
                $dllEntry = $dllEntries | Select-Object -First 1
              }
              $manifestName = [System.IO.Path]::ChangeExtension($dllEntry.Name, '.json')
              $manifestEntry = $archive.Entries | Where-Object { $_.Name -eq $manifestName }
              if (-not $manifestEntry) {
                throw "Manifest $manifestName not found inside latest.zip"
              }
              $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
              try {
                return ($reader.ReadToEnd() | ConvertFrom-Json)
              } finally {
                $reader.Dispose()
              }
            } finally {
              $archive.Dispose()
            }
          }

          $zip = Get-ChildItem -Path bin/Release -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw 'latest.zip not found under bin/Release' }

          $manifest = Read-ManifestFromZip $zip.FullName
          $assemblyVersion = [string]$manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($assemblyVersion)) {
            throw 'AssemblyVersion missing from plugin manifest'
          }

          $mode = '${{ steps.prep.outputs.mode }}'

          if ($mode -eq 'main') {
            $expected = '${{ steps.prep.outputs.version }}'
            if ($assemblyVersion -ne $expected) {
              throw "Expected AssemblyVersion $expected in latest.zip but found $assemblyVersion"
            }
            $tag = "v$expected"
            gh release view $tag 2>$null | Out-Null
            $releaseExists = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($releaseExists) {
              Write-Host "Release $tag already exists; skipping."
              exit 0
            }
            gh release create $tag $zip.FullName --target $env:GITHUB_SHA --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }

          if ($mode -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -replace '^v','' -ne $assemblyVersion) {
              throw "Tag $tag must match AssemblyVersion $assemblyVersion in latest.zip"
            }
            gh release create $tag $zip.FullName --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }

          $tag = "v$assemblyVersion"
          gh release view $tag 2>$null | Out-Null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($releaseExists) {
            Write-Host "Release $tag already exists; skipping."
            exit 0
          }
          gh release create $tag $zip.FullName --title $tag --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0